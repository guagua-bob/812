    <button class="result-reselect-hit" type="button" aria-label="重选，返回选择界面"></button>
    <button class="result-share-hit" type="button" aria-label="打开分享页面"></button>
    <button class="share-close-hit" type="button" aria-label="关闭分享页面并返回上一页"></button>
    <button class="retry-submit-hit" type="button" aria-label="重新选，查看推荐结果"></button>
  </main>
  <script src="app.js"></script>
</body>
</html>
